spring:
  application:
    name: picTalk
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  profiles:
    active: @spring.profiles.active@
  redis:
    database: 0
    host: ${REDIS_HOST:}
    port: 6379
    password: ${REDIS_PASSWORD:}
    timeout: 5000
  servlet:
    multipart:
      max-file-size: 50MB     # 单个文件最大 100MB
      max-request-size: 50MB  # 整个请求最大 100MB（如果只传一个文件，两者可相同）
  session:
    store-type: redis
    timeout: 1800
  jackson:
    date-format: yyyy-MM-dd HH:mm
    time-zone: GMT+8

  #允许跨域的地址
  cors:
    allowed-origin-patterns:
      - ${ALLOWED_ORIGIN_1:}
      - ${ALLOWED_ORIGIN_2:}
      - ${ALLOWED_ORIGIN_3:}
      - ${ALLOWED_ORIGIN_4:}

server:
  port: 8123
  servlet:
    context-path: /api

mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default:
        #        group-name: 默认分组
        api-rule: package
        api-rule-resources:
          - com.oxn.aiPicturesStore.controller



#文件上传地址
file:
  upload-dir: ${FILE_UPLOAD_DIR:}

# 文件清理配置
cleanup:
  cron: 0 */10 * * * ?

# 图片访问前缀配置
nginx:
  proxyUrl: ${NGINX_PROXY_URL:}

# 每日AI创建图片/删除图片限制
limit:
  create: 10
  edit: 10
